<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AR BET live soccer score alert monitor">
    <title>AR BET Live Score Alert</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #eef2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.22), transparent 34%),
          radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.16), transparent 32%),
          #0b1020;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      .badge {
        display: inline-block;
        margin-bottom: 24px;
        padding: 7px 12px;
        border-radius: 999px;
        color: #bae6fd;
        background: rgba(14, 165, 233, 0.14);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 480px;
        margin: 20px auto 0;
        color: #b8c3d9;
        font-size: 1.08rem;
        line-height: 1.7;
      }

      footer {
        margin-top: 36px;
        color: #71809d;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Live monitoring service</div>
      <h1>AR BET Live Score Alert</h1>
      <p>
        This service monitors live soccer markets and sends configured score alerts
        through Telegram.
      </p>
      <footer>Service is configured and running.</footer>
    </main>
  </body>
</html>
